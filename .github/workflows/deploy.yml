name: Deploy to Firebase Hosting

on:
  # Auto-deploy disabled until FIREBASE_SERVICE_ACCOUNT_OQUPA_PRODUCTION secret is configured.
  # Deploy manually: npm run build && firebase deploy --only hosting --project oqupa-production
  # push:
  #   branches: [master]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_OQUPA_PRODUCTION }}
          channelId: live
          projectId: oqupa-production
