name: CI & Deploy to Firebase Hosting

on:
  push:
    branches: [master, development]
  pull_request:
    branches: [master, development]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # Blocking on purpose, and separate from the type-check below, because
      # they catch different things. TypeScript cannot see React hook order.
      #
      # On 2026-08-04 every property page on oqupa.com showed "Algo salió mal"
      # for ~18 hours: a `const` had been changed to a `useState` in a spot
      # below the page's early returns. 323 tests passed and the build was
      # green, because nothing in this pipeline could see it — the project had
      # no linter at all. `react-hooks/rules-of-hooks` flags it in one second,
      # and on its first run here it also found a SECOND live instance of the
      # same mistake in ViewAsMenu, which would have crashed the dashboard for
      # admins only.
      #
      # Do NOT move this after the build or make it non-blocking: a hook-order
      # violation is a page that crashes for every visitor, not a style nit.
      - name: Lint
        run: npm run lint
      - name: Type-check
        run: npx tsc -b --noEmit
      # 282 tests existed but had never run in CI — they only executed when
      # someone remembered locally. Same failure shape as the Cloud Functions,
      # where 109 tests went unrun for months.
      - name: Tests
        run: npm test
      # NOTE: the access-list ↔ firestore.rules comparison canNOT run here —
      # firestore.rules lives in the Oqupa-Platform repo. It is enforced in that
      # repo's access-sync workflow, which checks out both and gates the rules
      # deploy.
      - name: Create .env for build
        run: echo "${{ secrets.DOTENV_PRODUCTION }}" > .env
      - name: Build
        run: npm run build
      # Blocking on purpose. Do NOT downgrade this to a warning — the next
      # advisory would slide through unnoticed, which is exactly how problems
      # here go unseen for months.
      #
      # One advisory is deliberately excused, with its reasoning, because it
      # cannot apply to this app and has no fixed version to move to:
      #
      #   GHSA-qwww-vcr4-c8h2 — React Router "RSC Mode CSRF Bypass".
      #   Only affects React Server Components mode. This is a client-only SPA
      #   (tsc + vite build, no server entry), so the vulnerable code path does
      #   not exist here. The advisory covers react-router 7.12.0 – 8.2.0, and
      #   the newest published release is 7.18.2 — there is nothing above the
      #   range to upgrade to, and npm's "fix" is a DOWNGRADE to 7.11.0.
      #   REVISIT when React Router publishes a stable release above 8.2.0.
      #
      # Every other advisory, at high or critical, still fails the build.
      - name: Dependency audit
        env:
          ALLOWED: GHSA-qwww-vcr4-c8h2
        run: |
          npm audit --audit-level=high --json > /tmp/audit.json 2>/dev/null || true
          node <<'GATE'
            const fs = require('fs');
            const allowed = new Set(process.env.ALLOWED.split(','));
            const report = JSON.parse(fs.readFileSync('/tmp/audit.json', 'utf8'));
            const vulns = report.vulnerabilities || {};

            // A package can be flagged for its OWN advisory (via entries are objects with a
            // GHSA url) or purely because it DEPENDS on a vulnerable package (via entries
            // are plain strings naming that parent). Follow the strings so a transitively
            // affected package is judged by the advisories actually behind it.
            function advisoryIds(name, seen = new Set()) {
              if (seen.has(name)) return [];
              seen.add(name);
              const v = vulns[name];
              if (!v) return [];
              const ids = [];
              for (const entry of v.via || []) {
                if (typeof entry === 'object' && entry.url) ids.push(entry.url.split('/').pop());
                else if (typeof entry === 'string') ids.push(...advisoryIds(entry, seen));
              }
              return ids;
            }

            const blocking = [];
            for (const [name, v] of Object.entries(vulns)) {
              if (!['high', 'critical'].includes(v.severity)) continue;
              const ids = [...new Set(advisoryIds(name))];
              if (ids.length && ids.every(id => allowed.has(id))) continue;
              blocking.push(`${name} (${v.severity}) ${ids.join(', ') || '[no advisory id]'}`);
            }

            if (blocking.length) {
              console.error('Blocking advisories:');
              blocking.forEach(b => console.error('  - ' + b));
              console.error('\nIf one genuinely does not apply, add its GHSA id to ALLOWED');
              console.error('with a comment explaining why and when to revisit.');
              process.exit(1);
            }
            console.log('No blocking advisories (allowlisted ones excused).');

          GATE

  deploy-staging:
    needs: build-and-test
    # `push` OR a manual run. Restricting this to `push` alone left no recovery
    # path when a webhook is dropped: on 2026-08-06 GitHub's Actions outage ate
    # the push event for the Piura page, and re-running by hand reported SUCCESS
    # while skipping the deploy entirely — a green run that shipped nothing.
    # Production (below) stays push-only on purpose; releases are deliberate.
    if: github.ref == 'refs/heads/development' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Create .env for staging build
        run: echo "${{ secrets.DOTENV_STAGING }}" > .env
      # App Check site key — appended rather than stored in DOTENV_STAGING so
      # this cannot disturb config that nobody can read back to verify. Public
      # by design: it ships in every visitor's page source, which is why the
      # Firebase config above is hardcoded here too.
      #
      # WHY IT MATTERS: recordListingView sets enforceAppCheck: true, so without
      # this key the callable rejects every web request and the website records
      # NO listing views at all. It had recorded none since it shipped —
      # listingViewDedupe was empty in production on 2026-08-04 — meaning every
      # view number on the platform came from the app only.
      #
      # Bound to localhost + oqupa-staging.* (site "Oqupa Website App Check
      # (Staging)"). NOT interchangeable with VITE_RECAPTCHA_SITE_KEY, which is
      # the waitlist form's key and a different reCAPTCHA site.
      - name: Add App Check site key (staging)
        run: echo "VITE_RECAPTCHA_APPCHECK_KEY=6Lf1WMYsAAAAAOMgBCCj9f5oDis5ilgzwjr8yK5Z" >> .env
      # --mode staging makes Vite set MODE='staging' (and PROD=false), which
      # tells imageUrl.ts to use the staging R2 host directly instead of the
      # /cdn-cgi/image/... Cloudflare-only path that production uses.
      - run: npm run build -- --mode staging
      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: 'projects/324931340315/locations/global/workloadIdentityPools/github-actions/providers/github'
          service_account: 'firebase-adminsdk-fbsvc@oqupa-staging.iam.gserviceaccount.com'
      - run: npm install -g firebase-tools
      - run: firebase deploy --only hosting --project oqupa-staging

  deploy-production:
    needs: build-and-test
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Create .env for production build
        run: echo "${{ secrets.DOTENV_PRODUCTION }}" > .env
      # See the staging job for the full rationale. Bound to oqupa.com,
      # www.oqupa.com and both oqupa-production Firebase hosts (site "Oqupa
      # Website App Check (Production)"). Deliberately NOT bound to localhost —
      # local development runs against staging and uses the staging key.
      - name: Add App Check site key (production)
        run: echo "VITE_RECAPTCHA_APPCHECK_KEY=6LfjWcYsAAAAANSKmb_sTrfeYLriwFGmk7jchxzg" >> .env
      - run: npm run build
      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: 'projects/109922131848/locations/global/workloadIdentityPools/github-actions/providers/github'
          service_account: 'firebase-adminsdk-fbsvc@oqupa-production.iam.gserviceaccount.com'
      - run: npm install -g firebase-tools
      - run: firebase deploy --only hosting --project oqupa-production
